# Samurai Vengeance — Netlify configuration
#
# IMPORTANT: No catch-all redirect here on purpose.
# A rule like  from = "/*"  ->  to = "/index.html"  intercepts
# ads.txt, robots.txt and sitemap.xml, which breaks AdSense
# verification and SEO crawling. This game is a single static
# page with no client-side routing, so no redirect is needed.
#
# The /api/* rule below is a targeted exception, NOT a catch-all — it only
# matches /api/, so ads.txt, robots.txt and sitemap.xml are untouched.

[build.environment]
  # Netlify's secret scanner flags the Firebase WEB api key in index.html
  # (AIzaSy...). That key is public by design — Firebase web config ships in
  # client code and authorizes nothing on its own; Firestore rules and Auth
  # settings are what actually protect the data. Skipping index.html silences
  # the false positive while leaving scanning on everywhere else, including
  # the function bundles, which is where a real leak would matter.
  SECRETS_SCAN_OMIT_PATHS = "index.html"

[functions]
  directory = "netlify/functions"
  # firebase-admin uses dynamic requires that the esbuild bundler can trip
  # over. Leaving it external means Netlify installs it as a real dependency
  # instead of trying to inline it.
  external_node_modules = ["firebase-admin"]

# Pretty URLs for the Stripe endpoints, so the game can call a relative
# /api/create-checkout instead of a hardcoded deployment hostname.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
