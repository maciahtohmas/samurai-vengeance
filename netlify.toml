# index.html is the game itself; send it to the bare root for the same reason.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The game must never be served from cache, or players sit on an old build and
# never see a fix. Netlify matches header rules against the REQUEST path, and
# almost every visitor asks for "/" rather than "/index.html", so scoping this
# to /index.html alone left the main URL cacheable. Both are listed.
# "no-cache" still makes the browser check for a new version on EVERY visit,
# so nobody sits on an old build. It used to also say "no-store", which threw
# the copy away and re-downloaded all ~600 KB each time even when nothing had
# changed. Netlify bandwidth is metered against the monthly credits, and a
# revalidated visit costs a few hundred bytes instead.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
